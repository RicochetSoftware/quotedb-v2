name: Dependency graph

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: dependency-graph
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required by GitHub's dependency submission API.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # GitHub cannot parse pnpm 12's two-document lockfile. Let pnpm read it
      # and submit all workspace dependencies, including dev and transitive deps.
      # This reads the lockfile without installing packages or running scripts.
      - name: Generate dependency inventory
        run: pnpm --filter '*' sbom --sbom-format spdx --lockfile-only --out "$RUNNER_TEMP/dependencies.spdx.json"
      - name: Submit dependency graph
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: ${{ runner.temp }}
          filePattern: dependencies.spdx.json
          manifestPath: pnpm-lock.yaml
          correlator: pnpm-workspace
