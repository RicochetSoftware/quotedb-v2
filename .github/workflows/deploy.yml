# One Droplet: PostgreSQL, API, and a Caddy image containing web/admin/site.
# Images are built on the runner; weekly releases refresh their base images.
# Secrets: DIGITALOCEAN_TOKEN, CLOUDFLARE_API_TOKEN, RESEND_API_KEY,
#          TOFU_STATE_PASSPHRASE, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, DEPLOY_SSH_KEY.
# Variables: DOMAIN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID, SSH_PUBLIC_KEYS (JSON),
#            optional DIGITALOCEAN_REGION, DROPLET_SIZE, DROPLET_BACKUPS, IZARO_USER_ID.
name: deploy

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/deploy.yml", ".github/actions/**"]
  push:
    branches: [master]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC, after the nightly unattended-upgrades reboot window
  workflow_dispatch:
    inputs:
      api_image:
        description: "Rollback API image; must also supply static_image"
        required: false

      bot_image:
        description: "Rollback bot image (required with rollback images when bot enabled)"
        required: false

      static_image:
        description: "Rollback frontend image built for the production domain; must also supply api_image"
        required: false

# Serialize the entire production release, including infrastructure and both images.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
  TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_access_team: ${{ vars.CF_ACCESS_TEAM || secrets.CF_ACCESS_TEAM }}
  TF_VAR_admin_hostname: ${{ vars.ADMIN_HOST || secrets.ADMIN_HOST }}
  TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
  TF_VAR_access_otp_provider_id: ${{ vars.CF_ACCESS_OTP_PROVIDER_ID || secrets.CF_ACCESS_OTP_PROVIDER_ID }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_ssh_public_keys: ${{ vars.SSH_PUBLIC_KEYS }}
  TF_VAR_digitalocean_region: ${{ vars.DIGITALOCEAN_REGION || 'fra1' }}
  TF_VAR_droplet_size: ${{ vars.DROPLET_SIZE || 's-1vcpu-1gb' }}
  TF_VAR_droplet_backups: ${{ vars.DROPLET_BACKUPS || 'false' }}
  TF_VAR_izaro_user_id: ${{ vars.IZARO_USER_ID }}
  TF_VAR_izaro_collection_id: ${{ vars.IZARO_COLLECTION_ID }}
  # R2 credentials for the S3 state backend.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # Dependabot PRs have no Actions secrets and a read-only GITHUB_TOKEN.
  # Validate with mocked providers without opening the production state backend.
  infra-check:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu validate
      - run: tofu test

  infra-plan:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tofu-init
        with:
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: tofu fmt -check -recursive
      - run: tofu validate
      - run: tofu test
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          tofu plan -no-color -lock-timeout=5m | tee plan.txt
      - name: Build PR comment
        if: always() && steps.plan.outcome != 'skipped'
        run: |
          {
            echo "### OpenTofu plan (${{ steps.plan.outcome }})"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > comment.md
      - uses: marocchino/sticky-pull-request-comment@v3
        if: always() && steps.plan.outcome != 'skipped'
        with:
          header: tofu-plan
          path: infra/terraform/comment.md

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image names
        id: images
        env:
          ROLLBACK_API: ${{ inputs.api_image }}
          ROLLBACK_STATIC: ${{ inputs.static_image }}
          ROLLBACK_BOT: ${{ inputs.bot_image }}
          BOT_ENABLED: ${{ vars.DISCORD_BOT_ENABLED }}
        run: |
          if [[ -n "$ROLLBACK_API" || -n "$ROLLBACK_STATIC" || -n "$ROLLBACK_BOT" ]]; then
            [[ -n "$ROLLBACK_API" && -n "$ROLLBACK_STATIC" ]] || { echo 'Supply both rollback images'; exit 1; }
            if [[ "$BOT_ENABLED" == "true" ]]; then
              [[ -n "$ROLLBACK_BOT" ]] || { echo 'Supply bot_image for rollback when bot is enabled'; exit 1; }
              echo "bot=$ROLLBACK_BOT" >> "$GITHUB_OUTPUT"
            fi
            echo "api=$ROLLBACK_API" >> "$GITHUB_OUTPUT"
            echo "static=$ROLLBACK_STATIC" >> "$GITHUB_OUTPUT"
          else
            {
              echo "api=ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}"
              echo "static=ghcr.io/${GITHUB_REPOSITORY,,}/static:${GITHUB_SHA}"
              echo "bot=ghcr.io/${GITHUB_REPOSITORY,,}/discord-bot:${GITHUB_SHA}"
              echo "build=true"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.images.outputs.build == 'true'
      - uses: docker/login-action@v4
        if: steps.images.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API
        uses: docker/build-push-action@v7
        if: steps.images.outputs.build == 'true'
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.images.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build frontend sites and Caddy
        uses: docker/build-push-action@v7
        if: steps.images.outputs.build == 'true'
        with:
          context: .
          file: infra/docker/static.Dockerfile
          platforms: linux/amd64
          build-args: |
            DOMAIN=${{ vars.DOMAIN }}
            ADMIN_HOST=${{ vars.ADMIN_HOST || secrets.ADMIN_HOST }}
          push: true
          pull: true
          tags: ${{ steps.images.outputs.static }}
          cache-from: type=gha,scope=static
          cache-to: type=gha,mode=max,scope=static
      - name: Build Discord bot
        uses: docker/build-push-action@v7
        if: steps.images.outputs.build == 'true' && vars.DISCORD_BOT_ENABLED == 'true'
        with:
          context: .
          file: infra/docker/discord-bot.Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.images.outputs.bot }}
          cache-from: type=gha,scope=discord-bot
          cache-to: type=gha,mode=max,scope=discord-bot
      - uses: ./.github/actions/tofu-init
        with:
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply infrastructure
        working-directory: infra/terraform
        run: |
          tofu fmt -check -recursive
          tofu validate
          tofu test
          tofu apply -auto-approve -lock-timeout=5m
      - name: Read deploy configuration
        id: target
        working-directory: infra/terraform
        run: |
          umask 077
          echo "ssh=$(tofu output -raw api_ssh_target)" >> "$GITHUB_OUTPUT"
          tofu output -raw api_ssh_known_hosts > "$RUNNER_TEMP/known_hosts"
          tofu output -raw api_env_file > "$RUNNER_TEMP/api.env"
          tofu output -raw postgres_env_file > "$RUNNER_TEMP/postgres.env"
          tofu output -raw admin_origin_certificate > "$RUNNER_TEMP/admin-origin.crt"
          tofu output -raw admin_origin_private_key > "$RUNNER_TEMP/admin-origin.key"
      - name: Load deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          ssh-add - <<<"$DEPLOY_SSH_KEY"
      - name: Deploy whole stack
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_TARGET: ${{ steps.target.outputs.ssh }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          STATIC_IMAGE: ${{ steps.images.outputs.static }}
          DOMAIN: ${{ vars.DOMAIN }}
          ADMIN_HOST: ${{ vars.ADMIN_HOST || secrets.ADMIN_HOST }}
          BOT_ENABLED: ${{ vars.DISCORD_BOT_ENABLED }}
          BOT_IMAGE_CANDIDATE: ${{ steps.images.outputs.bot }}
          DISCORD_BOT_ENV: ${{ secrets.DISCORD_BOT_ENV }}
        run: |
          if [[ "$BOT_ENABLED" == "true" ]]; then
            [[ -n "$DISCORD_BOT_ENV" ]] || { echo 'Missing DISCORD_BOT_ENV secret'; exit 1; }
            umask 077
            printf '%s\n' "$DISCORD_BOT_ENV" > "$RUNNER_TEMP/bot.env"
            export BOT_IMAGE="$BOT_IMAGE_CANDIDATE" BOT_ENV_FILE="$RUNNER_TEMP/bot.env"
          fi
          export ADMIN_ORIGIN_CERT_FILE="$RUNNER_TEMP/admin-origin.crt" ADMIN_ORIGIN_KEY_FILE="$RUNNER_TEMP/admin-origin.key"
          infra/droplet/deploy.sh "$DEPLOY_TARGET" "$API_IMAGE" "$STATIC_IMAGE" "$DOMAIN" \
            "$RUNNER_TEMP/api.env" "$RUNNER_TEMP/postgres.env" "$RUNNER_TEMP/known_hosts"
      - name: Remove temporary secrets
        if: always()
        run: |
          for file in "$RUNNER_TEMP/api.env" "$RUNNER_TEMP/postgres.env" "$RUNNER_TEMP/bot.env" "$RUNNER_TEMP/admin-origin.crt" "$RUNNER_TEMP/admin-origin.key"; do
            if [[ -f "$file" ]]; then unlink "$file"; fi
          done
