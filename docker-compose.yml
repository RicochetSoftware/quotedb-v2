# Local development services. The apps themselves run on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: quotedb
      POSTGRES_USER: quotedb
      POSTGRES_PASSWORD: quotedb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotedb -d quotedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # Web UI
volumes:
  postgres-data:
