# Whole production stack. Images are built off-server; only Caddy publishes ports.
name: quotedb

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: postgres.env
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    mem_limit: 256m
    memswap_limit: 512m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotedb -d quotedb"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    env_file: api.env
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 320m
    memswap_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: ${STATIC_IMAGE:?set STATIC_IMAGE}
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
