# Exit plan / prod-like local stack: the whole of QuoteDB on one machine.
#   cd infra/selfhost && cp .env.example .env && docker compose up -d --build
# Same containers as production, built locally instead of pulled from GHCR.
name: quotedb-selfhost

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotedb
      POSTGRES_USER: quotedb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotedb -d quotedb"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    # Migrations before start (production runs them as a separate step in infra/droplet/deploy.sh).
    command: ["sh", "-c", "node dist/migrate.js && node dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "8080"
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://quotedb:${POSTGRES_PASSWORD}@postgres:5432/quotedb
      APP_URL: https://api.${DOMAIN:?set DOMAIN}
      WEB_URL: https://app.${DOMAIN}
      ADMIN_URL: https://admin.${DOMAIN}
      COOKIE_DOMAIN: .${DOMAIN}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      MAIL_FROM: ${MAIL_FROM:-QuoteDB <no-reply@${DOMAIN}>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-smtp://localhost:1025}
      HIBP_ENABLED: ${HIBP_ENABLED:-true}
      IZARO_USER_ID: ${IZARO_USER_ID:-}
      IZARO_COLLECTION_ID: ${IZARO_COLLECTION_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    build:
      context: ../..
      dockerfile: infra/docker/static.Dockerfile
      args:
        DOMAIN: ${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
