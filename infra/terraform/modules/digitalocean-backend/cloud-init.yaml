#cloud-config
# First boot of the single Droplet. Everything that keeps it patched runs unattended from here on;
# .github/workflows/ops-check.yml alerts if it stops. App files arrive with each deploy
# (infra/droplet/deploy.sh), so nothing secret is in here except the SSH host key.

users:
  - name: ${deploy_user}
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys: ${jsonencode(ssh_public_keys)}

disable_root: true
ssh_pwauth: false

# Builds run in CI. Swap gives migrations and package upgrades some headroom on 1 GB.
swap:
  filename: /swapfile
  size: 2147483648
  maxsize: 2147483648

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - ufw

# Pinned host key (generated by OpenTofu), so CI can verify the server without trust-on-first-use.
ssh_deletekeys: true
ssh_genkeytypes: [ed25519] # only fills in missing keys, so the pinned one stays
ssh_keys:
  ed25519_private: |
    ${indent(4, host_key_private)}
  ed25519_public: ${host_key_public}

write_files:
  - path: /etc/ssh/sshd_config.d/10-quotedb.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers ${deploy_user}

  # Security and regular updates every night; reboot at 04:00 UTC when a kernel or libc needs it.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/apt/apt.conf.d/52quotedb-unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins:: "$${distro_id}:$${distro_codename}-updates";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  - path: /etc/systemd/system/quotedb-backup.service
    content: |
      [Unit]
      Description=QuoteDB logical PostgreSQL backup
      After=docker.service
      ConditionPathExists=/opt/quotedb/backup.sh
      [Service]
      Type=oneshot
      User=${deploy_user}
      WorkingDirectory=/opt/quotedb
      ExecStart=/opt/quotedb/backup.sh
      UMask=0077
  - path: /etc/systemd/system/quotedb-backup.timer
    content: |
      [Unit]
      Description=Daily QuoteDB database backup
      [Timer]
      OnCalendar=*-*-* 03:00:00 UTC
      Persistent=true
      [Install]
      WantedBy=timers.target

  # Docker rotates logs by default with the local driver (5 x 20 MB per container).
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "local" }

runcmd:
  - usermod -aG docker ${deploy_user}
  - install -d -o ${deploy_user} -g ${deploy_user} -m 750 /opt/quotedb
  - systemctl enable --now docker
  - systemctl restart docker
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw limit 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl daemon-reload
  - systemctl enable --now quotedb-backup.timer
  - systemctl restart ssh
